# ZimaOS / CasaOS app definition. Media lives in /DATA/Media (Movies, "TV Shows").
name: haul
services:
  haul:
    image: ghcr.io/squipy411/haul:latest
    container_name: haul
    restart: unless-stopped
    ports:
      - target: 60700
        published: "60700"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/haul/data
        target: /data
      - type: bind
        source: /DATA/Media
        target: /media
      # Network shares, USB drives and cloud drives that ZimaOS connects appear under /media on the host.
      # One connected after Haul started shows up once Haul restarts.
      - type: bind
        source: /media
        target: /drives
        bind:
          create_host_path: true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    x-casaos:
      ports:
        - container: "60700"
          description:
            en_US: Web dashboard and Nuvio addon
      volumes:
        - container: /data
          description:
            en_US: Haul settings, download queue and library index
        - container: /media
          description:
            en_US: Your media folder (Movies and TV Shows are written here)
        - container: /drives
          description:
            en_US: Network shares and USB drives connected in ZimaOS (add them in Haul's Settings → Folders)
x-casaos:
  architectures:
    - amd64
    - arm64
  main: haul
  author: Squipy411
  developer: Squipy411
  category: Media
  icon: https://raw.githubusercontent.com/Squipy411/haul/main/web/public/icon.png
  title:
    en_US: Haul
    custom: Haul
  tagline:
    en_US: Your own streaming site for TorBox, Real-Debrid, AllDebrid or Premiumize, and your own files
  description:
    en_US: Browse a catalog, pick a season pack or a whole season, and Haul fetches it through your debrid service (TorBox, Real-Debrid, AllDebrid or Premiumize), renames it for your library and serves it to Nuvio and Stremio. No Sonarr, Radarr or Seerr needed.
  index: /
  port_map: "60700"
  scheme: http
