# Haul with a free https://haul.<your-tailnet>.ts.net address that works from anywhere (Tailscale Funnel).
# 1. Make a free Tailscale account and an auth key: https://login.tailscale.com/admin/settings/keys
# 2. Change the media path below, then:  TS_AUTHKEY=tskey-auth-… docker compose up -d
#    (the key is only needed the first time; the login is kept in ./tailscale-state)
# 3. docker exec haul-tailscale tailscale funnel status   shows the address.
services:
  haul:
    image: ghcr.io/squipy411/haul:latest
    container_name: haul
    restart: unless-stopped
    ports:
      - "60700:60700"
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./haul-data:/data
      - /path/to/media:/media
  tailscale:
    image: tailscale/tailscale:stable
    container_name: haul-tailscale
    hostname: haul
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
