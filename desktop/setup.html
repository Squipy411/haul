<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Haul</title>
  <style>
    :root { color-scheme: dark; --line: #444444; --muted: #b4b4b4; --faint: #949494; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; align-content: center; padding: 40px 28px; background: #000; color: #fff; font: 14px/20px 'Segoe UI Variable Text', 'Segoe UI', -apple-system, system-ui, sans-serif; }
    form { width: min(560px, 100%); margin: 0 auto; display: grid; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
    .brand img { width: 24px; height: 24px; border-radius: 6px; }
    h1 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; }
    .panel { display: grid; border-radius: 16px; background: #111; overflow: hidden; }
    .choice { display: grid; grid-template-columns: 18px 1fr; gap: 12px; padding: 16px 18px; cursor: pointer; }
    .choice + .choice, .share + .choice { border-top: 1px solid #1e1e1e; }
    .choice input { accent-color: #fff; margin-top: 2px; }
    .choice b { display: block; font-weight: 500; }
    .choice span span { color: var(--muted); font-size: 13px; }
    input[type=text] { display: block; width: 100%; height: 40px; margin-top: 10px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #000; color: inherit; font: 13px Consolas, ui-monospace, monospace; outline: none; }
    input[type=text]:focus { border-color: #fff; }
    .share { display: flex; gap: 10px; align-items: flex-start; padding: 0 18px 16px 48px; color: var(--muted); font-size: 13px; cursor: pointer; }
    .share input { accent-color: #fff; margin-top: 2px; }
    button { justify-self: start; height: 36px; padding: 0 18px; border: 0; border-radius: 999px; background: #fff; color: #000; font: 500 14px inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .error { color: #e5566f; min-height: 20px; }
  </style>
</head>
<body>
  <form id="form">
    <div class="brand"><img src="icon.png" alt="" />Haul <span style="font-weight: 500; color: #949494; font-size: 13px;">Stream &amp; download</span></div>
    <h1>Where should Haul run?</h1>
    <div class="panel">
      <label class="choice">
        <input type="radio" name="mode" value="local" checked />
        <span><b>This PC</b><span>Haul runs inside this app and downloads to your Videos folder. Keep the app open while it downloads.</span></span>
      </label>
      <label class="share"><input type="checkbox" id="share" />Let Nuvio on a TV or phone play this PC's library (opens port 60700 on your home network)</label>
      <label class="choice">
        <input type="radio" name="mode" value="remote" />
        <span><b>A Haul server</b><span>Haul already running in Docker on a NAS or home server. Downloads land there.</span>
          <input type="text" id="url" placeholder="http://192.168.1.20:60700" spellcheck="false" /></span>
      </label>
    </div>
    <div class="error" id="error"></div>
    <button id="go">Continue</button>
  </form>
  <script src="setup.js"></script>
</body>
</html>
