# Haul with Docker Compose. Change the media path, then: docker compose up -d
services:
  haul:
    image: ghcr.io/squipy411/haul:latest
    container_name: haul
    restart: unless-stopped
    ports:
      - "60700:60700"
    environment:
      # Run as your user so new files belong to you (find yours with `id`). Leave out to run as root.
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./haul-data:/data
      # Your media folder. Haul writes to Movies/ and "TV Shows/" inside it (changeable in Settings).
      - /path/to/media:/media
      # Optional: a NAS share or another drive, mounted on this machine first (for example at /mnt/nas).
      # Add it in Haul's Settings → Folders as /drives/nas.
      # - /mnt/nas:/drives/nas
